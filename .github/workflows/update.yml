name: Update India desk

on:
  schedule:
    - cron: "23 */3 * * *"          # every 3 hours (India: 05:53, 08:53, 11:53 ...); GitHub may start runs late
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45            # Opus analysis and 13 outlets take longer than before
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main                  # 3 Nov: always start from the latest data, even when this run waited in the queue

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch headlines and analyse both desks
        run: node scripts/update.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_BUDGET_USD: "1000"     # 4 Nov 2026: cap removed in practice (was $4); the Anthropic credit balance is the only limit
          CALENDAR_JOB: "off"          # "on" to collect dates for the calendar again

      - name: Save results
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "desk-bot"
            git config user.email "desk-bot@users.noreply.github.com"
            git add data
            git commit -m "Update India desk"
            if ! git pull --rebase; then
              git rebase --abort
              echo "::error title=Results not saved::Another update reached the repo while this run was working, so its results could not be combined. Nothing on the site changed; the next run will start from the latest data."
              exit 1
            fi
            git push
          else
            echo "No changes"
          fi
