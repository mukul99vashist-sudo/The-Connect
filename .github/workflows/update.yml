name: Update India desk

on:
  schedule:
    - cron: "23 */3 * * *"          # every 3 hours (India: 05:53, 08:53, 11:53 ...); GitHub may start runs late
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45            # Opus analysis and 13 outlets take longer than before
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch headlines and analyse both desks
        run: node scripts/update.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_BUDGET_USD: "6"        # hard daily spending cap in US$ (India day); change here
          CALENDAR_JOB: "off"          # "on" to collect dates for the calendar again

      - name: Save results
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "desk-bot"
            git config user.email "desk-bot@users.noreply.github.com"
            git add data
            git commit -m "Update India desk"
            git pull --rebase
            git push
          else
            echo "No changes"
          fi
